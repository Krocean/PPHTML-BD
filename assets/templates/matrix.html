<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경쟁</title>
<link rel="stylesheet" href="../kit/theme-cobalt.css">
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .plot { position: absolute; left: 104px; top: 228px; width: 520px; height: 400px; border-left: 2px solid var(--ph-ink); border-bottom: 2px solid var(--ph-ink); }
  .plot .mid-x { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ph-line); }
  .plot .mid-y { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--ph-line); }
  .plot .good { position: absolute; left: 50%; top: 0; right: 0; height: 50%; background: var(--ph-accent-soft); }
  .ax { position: absolute; font-size: 12.5px; color: var(--ph-ink2); white-space: nowrap; }
  .ax-x0 { left: 104px; top: 640px; } .ax-x1 { left: 404px; top: 640px; width: 220px; text-align: right; }
  .ax-y0 { left: 64px; top: 600px; width: 30px; } .ax-y1 { left: 64px; top: 228px; width: 30px; }
  .ax-y0, .ax-y1 { white-space: normal; line-height: 1.35; font-size: 12px; }
  .dot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--ph-ink3); cursor: pointer; }
  .dot b { position: absolute; left: 26px; top: -3px; font-size: 13.5px; font-weight: 400; color: var(--ph-ink2); white-space: nowrap; }
  .dot.is-left b { left: auto; right: 26px; }
  .dot.is-us { background: var(--ph-accent); width: 24px; height: 24px; margin: -12px 0 0 -12px; }
  .dot.is-us b { font-weight: var(--ph-strong-weight); color: var(--ph-ink); top: 0; left: 40px; }
  .dot.is-on { box-shadow: 0 0 0 5px var(--ph-accent-soft), 0 0 0 7px var(--ph-accent); }
  .dot.is-on b { color: var(--ph-ink); font-weight: var(--ph-strong-weight); }
  .info { position: absolute; left: 700px; top: 228px; width: 516px; height: 428px; padding: 28px 30px; }
  .info h2 { margin-top: 12px; }
  .info .what { margin-top: 10px; font-size: 15.5px; line-height: 1.7; color: var(--ph-ink2); height: 82px; }
  .kv { position: relative; padding: 13px 0 13px 96px; border-top: 1px solid var(--ph-line); font-size: 14.5px; line-height: 1.6; min-height: 50px; }
  .kv span { position: absolute; left: 0; top: 13px; font-size: 13px; color: var(--ph-ink2); }
</style>
</head>
<body>
<div class="ph-page">
  <div class="ph-label ph-rise"><i></i>경쟁</div>
  <h1 class="ph-h1 ph-rise ph-d1 ph-mt8">정확하면서 <em>바로 쓸 수 있는</em> 자리는 비어 있습니다</h1>
</div>

<div class="plot" id="plot"><div class="good"></div><div class="mid-x"></div><div class="mid-y"></div></div>
<div class="ax ax-x0" id="x0"></div><div class="ax ax-x1" id="x1"></div>
<div class="ax ax-y0" id="y0"></div><div class="ax ax-y1" id="y1"></div>

<div class="ph-card info">
  <span class="ph-badge" id="tag"></span>
  <h2 class="ph-h2" id="name"></h2>
  <p class="what" id="what"></p>
  <div class="kv"><span>잘하는 것</span><div id="good"></div></div>
  <div class="kv"><span>아쉬운 것</span><div id="weak"></div></div>
</div>

<script src="../kit/kit.js"></script>
<script src="../kit/kit-deck.js"></script>
<script>
/* 바꿀 곳: AXES (가로축과 세로축의 양 끝 말), ITEMS (점마다 x, y 는 0~100, us: true 가 우리).
   축은 고객이 고를 때 실제로 따지는 두 가지로 잡습니다. 우리에게만 유리한 축은 금방 들킵니다. */
var AXES = { x: ["손이 많이 감", "바로 씀"], y: ["감으로", "숫자로"] };
var ITEMS = [
  { name: "반죽", x: 84, y: 82, us: true, what: "계산대 판매 기록을 읽어 내일 구울 양을 빵마다 알려 줍니다. 설치는 15분이면 끝납니다.", good: "따로 입력할 것이 없고, 날씨와 동네 행사까지 봅니다.", weak: "계산대 기록이 석 달은 쌓여 있어야 정확합니다." },
  { name: "종이 장부", x: 74, y: 14, what: "지금 가장 많이 쓰는 방법입니다. 사장님의 기억과 감이 전부입니다.", good: "배울 것이 없습니다.", weak: "사장님이 자리를 비우면 아무도 정하지 못합니다." },
  { name: "엑셀 표", x: 26, y: 44, left: false, what: "지난 판매량을 표에 옮겨 적고 평균을 냅니다.", good: "돈이 들지 않고 원하는 대로 고칠 수 있습니다.", weak: "매일 옮겨 적어야 하고 날씨는 반영하지 못합니다." },
  { name: "체인 본사 시스템", x: 18, y: 86, what: "대형 프랜차이즈가 본사에서 쓰는 수요 예측 시스템입니다.", good: "정확합니다. 수백 개 매장의 자료로 배웁니다.", weak: "개인 빵집은 살 수 없고, 들여놓는 데 몇 달이 걸립니다." },
  { name: "계산대 통계", x: 62, y: 48, what: "계산대 프로그램에 딸린 판매 통계 화면입니다.", good: "이미 갖고 있습니다.", weak: "지난 일만 보여 줍니다. 내일 얼마나 구울지는 알려 주지 않습니다." }
];
var dots = [];

PH.nav({ brand: "반죽", links: [["문제", 1], ["시장", 2], ["경쟁", 3], ["팀", 4], ["투자", 5]], page: 3 });
PH.ring();
PH.deck();

PH.$("#x0").textContent = "← " + AXES.x[0]; PH.$("#x1").textContent = AXES.x[1] + " →";
PH.$("#y0").textContent = AXES.y[0]; PH.$("#y1").textContent = AXES.y[1];
function show(i) {
  var it = ITEMS[i], tag = PH.$("#tag");
  dots.forEach(function (d, k) { PH.toggle(d, "is-on", k === i); });
  tag.textContent = it.us ? "우리" : "다른 방법"; PH.toggle(tag, "ph-plain", !it.us);
  PH.$("#name").textContent = it.name; PH.$("#what").textContent = it.what; PH.$("#good").textContent = it.good; PH.$("#weak").textContent = it.weak;
}
ITEMS.forEach(function (it, i) {
  var d = PH.make("div", "dot ph-hot" + (it.us ? " is-us" : "") + (it.x > 66 && !it.us ? " is-left" : ""), null, PH.$("#plot"));
  d.style.left = it.x + "%"; d.style.top = (100 - it.y) + "%";
  PH.make("b", "", it.name, d);
  PH.on(d, "click", function () { show(i); });
  dots.push(d);
});
PH.onShow(function () { show(0); });
</script>
</body>
</html>
