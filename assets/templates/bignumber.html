<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>큰 숫자</title>
<link rel="stylesheet" href="../kit/theme-cobalt.css">
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .wrap { position: absolute; left: 64px; right: 64px; top: 120px; text-align: center; }
  .num { font-size: 230px; line-height: 1; margin-top: 18px; white-space: nowrap; }
  .num small { font-size: 64px; margin-left: 8px; color: var(--ph-ink2); letter-spacing: 0; }
  .what { margin-top: 18px; font-size: 24px; }
  .why { width: 640px; margin: 14px auto 0; font-size: 16px; line-height: 1.75; color: var(--ph-ink2); height: 56px; }
  .picks { position: absolute; left: 0; right: 0; bottom: 78px; text-align: center; }
  .picks .ph-chip { margin: 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ph-label ph-rise"><i></i>숫자 하나</div>
  <div class="num ph-num"><span id="n"></span><small id="u"></small></div>
  <div class="what" id="what"></div>
  <p class="why" id="why"></p>
</div>
<div class="picks ph-chips" id="picks"></div>

<script src="../kit/kit.js"></script>
<script src="../kit/kit-deck.js"></script>
<script>
/* 바꿀 곳: FACTS (칩 이름, 숫자, 단위, 한 줄 뜻, 설명). 한 장에 숫자 하나만 크게 보여 주고, 칩으로 다른 숫자로 바꿉니다. */
var FACTS = [
  { chip: "지키는 시간", n: 3, digits: 0, u: "시간", what: "62℃를 지키는 시간", why: "받침에 올려 두지 않아도 됩니다. 컵 바닥의 얇은 열판이 온도가 떨어질 때만 켜집니다." },
  { chip: "무게", n: 310, digits: 0, u: "g", what: "보통 머그보다 40g 무겁습니다", why: "배터리와 열판을 넣고도 손목이 알아채기 어려운 차이로 맞췄습니다." },
  { chip: "충전", n: 45, digits: 0, u: "분", what: "받침에 올려 두면 다 찹니다", why: "책상에 받침을 두고 쓰면 따로 충전할 일이 없습니다." },
  { chip: "세척", n: 100, digits: 0, u: "%", what: "통째로 물에 씻습니다", why: "전자 부품은 바닥에 막혀 있습니다. 식기세척기에 넣어도 됩니다." }
];
PH.nav({ brand: "온도", links: [["왜", 1], ["숫자", 2], ["기능", 3], ["가격", 4]], page: 2 });
PH.ring();
PH.deck();
function pick(i) {
  var f = FACTS[i];
  PH.$$("#picks .ph-chip").forEach(function (c, k) { PH.toggle(c, "is-on", k === i); });
  PH.countUp(PH.$("#n"), f.n, f.digits);
  PH.$("#u").textContent = f.u; PH.$("#what").textContent = f.what; PH.$("#why").textContent = f.why;
}
FACTS.forEach(function (f, i) { PH.on(PH.make("span", "ph-chip", f.chip, PH.$("#picks")), "click", function () { pick(i); }); });
PH.onShow(function () { pick(0); });
</script>
</body>
</html>
