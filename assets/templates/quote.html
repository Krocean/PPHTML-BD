<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>후기</title>
<link rel="stylesheet" href="../kit/theme-cobalt.css">
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .wrap { position: absolute; left: 140px; right: 140px; top: 136px; }
  .mark { font-family: Georgia, "Times New Roman", serif; font-size: 120px; line-height: 80px; height: 62px; color: var(--ph-accent); }
  .say { font-family: var(--ph-display); font-weight: var(--ph-display-weight); letter-spacing: var(--ph-display-tracking); font-size: 42px; line-height: 1.42; height: 240px; margin-top: 18px; }
  .who { font-size: 17px; }
  .who span { color: var(--ph-ink2); margin-left: 10px; font-size: 15px; }
  .faces { position: absolute; left: 140px; bottom: 76px; white-space: nowrap; }
  .face { display: inline-block; width: 46px; height: 46px; line-height: 46px; border-radius: 50%; text-align: center; margin-right: 10px; background: var(--ph-hover2); color: var(--ph-ink2); font-weight: var(--ph-strong-weight); cursor: pointer; }
  .face.is-on { background: var(--ph-accent); color: var(--ph-accent-ink); }
  .score { position: absolute; right: 140px; bottom: 76px; height: 46px; line-height: 46px; font-size: 14px; color: var(--ph-ink2); }
  .score b { font-size: 26px; color: var(--ph-ink); margin-right: 8px; vertical-align: -2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ph-label ph-rise"><i></i>먼저 써 본 사람들</div>
  <div class="mark ph-mt24">“</div>
  <div class="say" id="say"></div>
  <div class="who"><b id="who"></b><span id="role"></span></div>
</div>
<div class="faces ph-noedit" id="faces"></div>
<div class="score"><b class="ph-num">4.8</b>후기 1,204개의 평균 · 5점 만점</div>

<script src="../kit/kit.js"></script>
<script src="../kit/kit-deck.js"></script>
<script>
/* 바꿀 곳: QUOTES (한 말, 이름, 어떤 사람인지). 얼굴 단추를 누르면 바뀌고, 누르기 전에는 6초마다 넘어갑니다.
   후기는 길어도 두 문장. 숫자가 들어 있는 말이 가장 잘 들립니다. 지어낸 후기는 쓰지 않습니다(여기 것은 틀을 보여 주는 예시입니다). */
var QUOTES = [
  { say: "회의가 길어져도 커피가 그대로예요. 식은 커피를 버리러 가는 일이 없어졌습니다.", who: "한서윤", role: "디자이너 · 석 달째" },
  { say: "하루에 세 잔 내리던 걸 한 잔으로 줄였어요. 끝까지 마시게 되니까요.", who: "오지환", role: "개발자 · 다섯 달째" },
  { say: "아이 재우고 나와도 차가 따뜻합니다. 이게 이렇게 큰일인 줄 몰랐어요.", who: "문가은", role: "두 아이의 엄마 · 두 달째" },
  { say: "받침에 올려 두면 끝이라 충전을 잊을 일이 없어요. 선이 없는 책상이 좋습니다.", who: "배도현", role: "회계사 · 넉 달째" }
];
var faces = [], cur = 0, auto = 0;

PH.nav({ brand: "온도", links: [["왜", 1], ["숫자", 2], ["기능", 3], ["가격", 4]], page: 3 });
PH.ring();
PH.deck();

function show(i) {
  var q = QUOTES[i]; cur = i;
  faces.forEach(function (f, k) { PH.toggle(f, "is-on", k === i); });
  PH.$("#say").textContent = q.say; PH.$("#who").textContent = q.who; PH.$("#role").textContent = q.role;
}
QUOTES.forEach(function (q, i) {
  var f = PH.make("span", "face ph-hot", q.who.charAt(0), PH.$("#faces"));
  PH.on(f, "click", function () { PH.stop(auto); auto = 0; show(i); });
  faces.push(f);
});
PH.onShow(function () { show(0); auto = PH.every(6000, function () { show((cur + 1) % QUOTES.length); }); });
</script>
</body>
</html>
